<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>صحتنا — Apple Watch | هوية منصة صحتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
   :root {
    /* هوية منصة صحتنا */
    --green: #14593C;
    --green-dark: #0E4530;
    --green-light: #E8F1ED;
    --green-soft: #D1E7DC;
    --pink: #DB2777;
    --pink-light: #FDF2F8;
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --red: #E11D48;
    --red-light: #FEF2F2;
    --bg: #F8F8F7;

    /* ألوان خصائص الساعة من ألوان الموقع */
    --c-meds: var(--green);
    --c-meds-d: #FFFFFF;
    --c-appts: var(--blue);
    --c-appts-d: #FFFFFF;
    --c-inv: var(--pink);
    --c-inv-d: #FFFFFF;
    --c-pat: var(--blue); /* تنبيهات الوالد عبدالله */
    --c-pat-d: #FFFFFF;
    --c-warn: #DC2626;
    --c-notif: var(--pink);
    --c-notif-d: #FFFFFF;
    --c-docs: var(--green);
    --c-docs-d: #FFFFFF;
  }
 
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #e8e8eb 0%, #b8b8bc 100%);
    font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 2rem 1rem;
  }
  .page { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .watch-wrap { position: relative; width: 300px; height: 560px; }
 
  .strap-top, .strap-bot { position: absolute; left: 50%; transform: translateX(-50%); width: 132px; background: #19191b; z-index: 1; }
  .strap-top { top: 4px; height: 116px; border-radius: 28px 28px 6px 6px; }
  .strap-bot { bottom: 4px; height: 116px; border-radius: 6px 6px 28px 28px; }
  .strap-top::after, .strap-bot::after { content: ''; position: absolute; left: 0; right: 0; height: 6px; background: #050506; }
  .strap-top::after { bottom: -2px; border-radius: 0 0 3px 3px; }
  .strap-bot::after { top: -2px; border-radius: 3px 3px 0 0; }
 
  .watch { position: absolute; top: 116px; left: 50%; transform: translateX(-50%); width: 268px; height: 326px; background: #1a1a1c; border-radius: 56px; z-index: 2; border-top: 1px solid #2e2e30; border-bottom: 1px solid #050505; box-shadow: 0 8px 24px rgba(0,0,0,0.3), inset 0 0 0 1px #0a0a0b; }
  .crown { position: absolute; right: -12px; top: 80px; width: 18px; height: 40px; background: #2c2c2e; border-radius: 3px 5px 5px 3px; z-index: 3; border: none; border-left: 1px solid #1a1a1a; box-shadow: inset -1px 0 0 #0a0a0a, 1px 0 2px rgba(0,0,0,0.4); cursor: pointer; transition: transform 0.12s ease; padding: 0; }
  .crown:active { transform: translateX(-3px); }
  .crown::before { content: ''; position: absolute; inset: 4px 1px 4px 2px; background-image: repeating-linear-gradient(0deg, #141416 0, #141416 1.5px, #3e3e40 1.5px, #3e3e40 3px); border-radius: 2px; pointer-events: none; }
  .crown::after { content: ''; position: absolute; right: -1px; top: 50%; transform: translateY(-50%); width: 4px; height: 24px; background: #0a0a0c; border-radius: 0 2px 2px 0; pointer-events: none; }
  .side-btn { position: absolute; right: -6px; top: 152px; width: 11px; height: 40px; background: #2c2c2e; border: none; border-radius: 2px 4px 4px 2px; border-top: 1px solid #4a4a4c; z-index: 3; cursor: pointer; padding: 0; }
  .side-btn:active { transform: translateX(-3px); }
  .speaker { position: absolute; left: -3px; top: 116px; width: 5px; height: 56px; background: #050506; border-radius: 1px 0 0 1px; z-index: 3; }
 
  .display { position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px; background: #000; border-radius: 44px; overflow: hidden; color: #fff; }
  .status-bar { direction: ltr; display: flex; justify-content: flex-end; padding: 10px 22px 4px; font-size: 12px; }
  /* Hide global status bar when inside Sehetna app — brand-header takes over */
  .display.in-app .status-bar { display: none; }
  .status-time { color: var(--c-meds); font-weight: 600; }
  .view { height: calc(100% - 32px); position: relative; }
 
  /* HONEYCOMB */
  .honey { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px; }
  .honey-row { display: flex; gap: 5px; margin-top: -2px; }
  .honey-row:first-child { margin-top: 0; }
  .honey-offset { padding-inline-start: 25px; }
  .honey-edge { transform: scale(0.72); opacity: 0.55; margin-top: -10px; margin-bottom: -10px; }
  .app { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.18s ease; border: none; padding: 0; flex-shrink: 0; }
  .app:hover { transform: scale(1.12); }
  .app:active { transform: scale(0.92); }
  .app svg { width: 56%; height: 56%; }
  .app-phone, .app-msg { background: #34c759; }
  .app-mail, .app-weather { background: #007aff; }
  .app-music, .app-news { background: #fa233b; }
  .app-camera, .app-maps, .app-fitness, .app-clock, .app-stocks { background: #1c1c1e; }
  .app-heart { background: #ff2d55; }
  .app-settings { background: #6e6e73; }
  .app-podcasts { background: #c155de; }
  .app-sehetna { background: var(--c-meds); box-shadow: 0 0 0 2px rgba(0,230,118,0.28); }
  .app-notif-home { background: var(--c-notif); box-shadow: 0 0 0 2px rgba(255,55,95,0.28); }
 
  /* ───── BRAND HEADER (top bar: mic + "صحتنا" + time on one line) ───── */
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 6px;
    flex-shrink: 0;
    direction: rtl;
  }
  .brand-header-right {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--c-meds);
    letter-spacing: 0.2px;
  }
  .brand-mic {
    background: rgba(255,255,255,0.1);
    border: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s, transform 0.12s;
  }
  .brand-mic:hover { background: rgba(255,255,255,0.2); }
  .brand-mic:active { transform: scale(0.92); }
  .brand-mic svg { width: 13px; height: 13px; fill: var(--c-meds); }
  .brand-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--c-meds);
    direction: ltr;
  }
 
  /* HEADER */
  .app-header { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
  .back-btn { background: transparent; border: none; font-size: 24px; line-height: 1; cursor: pointer; padding: 0 4px; font-family: inherit; }
  .app-title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; margin-inline-end: 28px; }
 
  /* MIC BUTTON in header */
  .mic-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.12s;
  }
  .mic-btn:hover { background: rgba(255,255,255,0.16); }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn svg { width: 14px; height: 14px; fill: var(--c-meds); }
  .meds-theme  .back-btn, .meds-theme  .app-title  { color: var(--c-meds); }
  .appts-theme .back-btn, .appts-theme .app-title  { color: var(--c-appts); }
  .inv-theme   .back-btn, .inv-theme   .app-title  { color: var(--c-inv); }
  .docs-theme  .back-btn, .docs-theme  .app-title  { color: var(--c-docs); }
  .notif-theme .back-btn, .notif-theme .app-title  { color: var(--c-notif); }
  .menu-theme  .back-btn { color: var(--c-meds); }
  .menu-theme  .app-title { color: #fff; }
 
  /* HORIZONTAL PAGINATION */
  .h-pages {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .h-pages::-webkit-scrollbar { display: none; }
  .h-page {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .v-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .v-scroll::-webkit-scrollbar { width: 0; }
 
  .h-dots {
    display: flex; gap: 5px; justify-content: center;
    padding: 6px 0 10px; flex-shrink: 0;
  }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25); transition: all 0.25s ease; }
  .dot.active { width: 18px; background: white; }
 
  /* ───── VERTICAL SNAP SCROLL (Apple Watch style for main menu) ───── */
  .v-snap-container {
    flex: 1;
    overflow-y: scroll;
    /* Mandatory vertical snap — page locks to nearest section */
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    /* Hide scrollbar across browsers */
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
  }
  .v-snap-container::-webkit-scrollbar { display: none; }
 
  .v-snap-section {
    /* Each section takes full visible height of its container */
    height: 100%;
    min-height: 100%;
    /* Lock to top edge of viewport when scrolling stops */
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
  }
 
  /* Side vertical dots — fixed over the scrolling content */
  .v-side-dots {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    z-index: 5;
    pointer-events: none;
  }
  .v-dot {
    width: 5px;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    margin: 3px 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .v-dot.active {
    background: var(--c-meds);
    height: 14px;
    border-radius: 3px;
  }
  .menu-card-btn { background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 0; color: white; font-family: inherit; }
  .menu-card-circle { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.18s ease; }
  .menu-card-btn:hover .menu-card-circle { transform: scale(1.06); }
  .menu-card-btn:active .menu-card-circle { transform: scale(0.93); }
  .menu-card-circle svg { width: 50px; height: 50px; fill: white; }
  .menu-c-meds  { background: var(--c-meds);  box-shadow: 0 6px 18px rgba(0,230,118,0.35); }
  .menu-c-appts { background: var(--c-appts); box-shadow: 0 6px 18px rgba(10,132,255,0.35); }
  .menu-c-inv   { background: var(--c-inv);   box-shadow: 0 6px 18px rgba(255,159,10,0.35); }
  .menu-c-notif { background: var(--c-notif); box-shadow: 0 6px 18px rgba(255,55,95,0.35); }
  .menu-card-label { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
 
  /* PERSON HEADER */
  .person-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 10px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .person-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    flex-shrink: 0;
  }
  .meds-theme  .avatar-me { background: var(--c-meds);  color: var(--c-meds-d); }
  .appts-theme .avatar-me { background: var(--c-appts); color: white; }
  .inv-theme   .avatar-me { background: var(--c-inv);   color: var(--c-inv-d); }
  .avatar-patient { background: var(--c-pat); color: white; }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-size: 15px; font-weight: 700; line-height: 1.1; }
  .person-rel { font-size: 11px; opacity: 0.55; margin-top: 1px; }
  .person-tag {
    font-size: 10px; font-weight: 700;
    padding: 4px 8px; border-radius: 7px;
    letter-spacing: 0.3px;
  }
  .meds-theme  .tag-me { background: var(--c-meds);  color: var(--c-meds-d); }
  .appts-theme .tag-me { background: var(--c-appts); color: white; }
  .inv-theme   .tag-me { background: var(--c-inv);   color: var(--c-inv-d); }
  .tag-patient { background: var(--c-pat); color: white; }
 
  /* HERO CARD */
  .hero {
    border-radius: 18px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .hero-meds  { background: var(--c-meds);  color: var(--c-meds-d); }
  .hero-appts { background: var(--c-appts); color: white; }
  .hero-warn  { background: var(--c-warn);  color: white; }
  .hero-label { font-size: 11px; font-weight: 600; opacity: 0.75; letter-spacing: 0.4px; text-transform: uppercase; }
  .hero-time  { font-size: 28px; font-weight: 700; line-height: 1.1; margin: 4px 0 2px; }
  .hero-name  { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .hero-sub   { font-size: 12px; opacity: 0.8; margin-top: 2px; }
 
  .person-patient .hero-meds  { background: var(--c-pat); color: white; }
  .person-patient .hero-appts { background: var(--c-pat); color: white; }
 
  .section-label {
    font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin: 4px 4px 6px;
    letter-spacing: 0.3px;
  }
 
  /* MED row */
  .med-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,0.06); margin-bottom: 6px; cursor: pointer; transition: background 0.15s; }
  .med-item:hover { background: rgba(255,255,255,0.09); }
  .med-item.taken { opacity: 0.4; }
  .med-time-badge { background: rgba(0,230,118,0.18); color: var(--c-meds); border-radius: 10px; padding: 6px 7px; font-size: 11px; font-weight: 700; min-width: 50px; text-align: center; line-height: 1.2; }
  .person-patient .med-time-badge { background: rgba(191,90,242,0.2); color: var(--c-pat); }
  .med-item.taken .med-time-badge { background: rgba(255,255,255,0.06); color: #888; }
  .med-info { flex: 1; min-width: 0; }
  .med-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .med-dose { font-size: 11px; color: #999; margin-top: 2px; }
  .med-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .med-item.taken .med-check { background: var(--c-meds); border-color: var(--c-meds); }
  .person-patient .med-item.taken .med-check { background: var(--c-pat); border-color: var(--c-pat); }
  .med-check svg { width: 12px; height: 12px; opacity: 0; }
  .med-item.taken .med-check svg { opacity: 1; }
 
  /* APPT — only one card */
  .appt-card-label { font-size: 11px; font-weight: 600; opacity: 0.6; letter-spacing: 0.3px; text-transform: uppercase; }
  .appt-date { font-size: 12px; font-weight: 700; color: var(--c-appts); margin-top: 4px; }
  .person-patient .appt-date { color: var(--c-pat); }
  .appt-time-big { font-size: 28px; font-weight: 700; margin: 4px 0 6px; line-height: 1.05; }
  .appt-hospital { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .appt-dept { font-size: 13px; color: #aaa; margin-top: 4px; }
 
  /* INVENTORY — bigger fonts */
  .inv-card {
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 8px;
  }
  .inv-card.low { background: rgba(255,69,58,0.12); border: 1.5px solid rgba(255,69,58,0.4); }
  .inv-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
  .inv-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .inv-qty { font-size: 14px; color: #aaa; flex-shrink: 0; font-weight: 700; }
  .inv-card.low .inv-qty { color: var(--c-warn); }
  .inv-bar-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .inv-bar-fill { height: 100%; background: var(--c-inv); border-radius: 4px; }
  .inv-card.low .inv-bar-fill { background: var(--c-warn); }
  .inv-bar-fill.high { background: var(--c-meds); }
  .inv-days { font-size: 13px; color: #bbb; margin-top: 8px; font-weight: 600; }
  .inv-card.low .inv-days { color: var(--c-warn); font-weight: 700; }
 
  /* ───── NOTIFICATIONS SECTION ───── */
  .notif-intro {
    padding: 14px 14px 10px;
    text-align: center;
  }
  .notif-intro-icon { font-size: 36px; line-height: 1; margin-bottom: 8px; }
  .notif-intro-title { font-size: 15px; font-weight: 700; color: var(--c-notif); margin-bottom: 4px; }
  .notif-intro-sub { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.4; }
 
  .notif-trigger-btn {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: none;
    padding: 11px 12px;
    border-radius: 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 6px;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
    text-align: start;
    color: white;
  }
  .notif-trigger-btn:hover { background: rgba(255,255,255,0.1); }
  .notif-trigger-btn:active { transform: scale(0.98); }
  .nt-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }
  .nt-icon.meds   { background: var(--c-meds);  }
  .nt-icon.appts  { background: var(--c-appts); }
  .nt-icon.mrf    { background: var(--c-inv);   }
  .nt-icon.clinic { background: var(--c-pat);   }
  .nt-text { flex: 1; min-width: 0; }
  .nt-label { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .nt-sub { font-size: 10px; opacity: 0.55; margin-top: 2px; }
 
  /* ───── NOTIFICATION OVERLAY (covers entire watch face) ───── */
  .notif-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 20;
    display: none;
    flex-direction: column;
    animation: slideDown 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .notif-overlay.active { display: flex; }
  @keyframes slideDown {
    from { transform: translateY(-100%); }
    to   { transform: translateY(0); }
  }
 
  /* Pulsing/glowing effect for medication alerts — draws attention */
  .notif-overlay.pulse {
    animation: slideDown 0.45s cubic-bezier(0.22, 1, 0.36, 1),
               pulseGlow 1.4s ease-in-out 0.45s infinite;
  }
  @keyframes pulseGlow {
    0%, 100% {
      box-shadow: inset 0 0 0 0 rgba(0,230,118,0);
      background: #000;
    }
    50% {
      box-shadow: inset 0 0 60px 8px rgba(0,230,118,0.45);
      background: #0a1f10;
    }
  }
 
  .notif-hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .notif-hdr-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 12px;
  }
  .notif-hdr-name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.7); }
  .notif-hdr-time { margin-inline-start: auto; font-size: 11px; color: rgba(255,255,255,0.5); direction: ltr; }
 
  .notif-body {
    padding: 12px 14px 8px;
    flex: 1;
    overflow-y: auto;
  }
  .notif-body::-webkit-scrollbar { width: 0; }
 
  .notif-big-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; font-size: 26px;
  }
  .notif-big-icon.meds   { background: var(--c-meds);   color: var(--c-meds-d); }
  .notif-big-icon.appts  { background: var(--c-appts);  color: white; }
  .notif-big-icon.mrf    { background: var(--c-inv);    color: var(--c-inv-d); }
  .notif-big-icon.clinic { background: var(--c-pat);    color: white; }
 
  .notif-for {
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
    margin-bottom: 8px;
    display: inline-block;
    letter-spacing: 0.3px;
  }
  .notif-for.me      { background: var(--c-meds); color: var(--c-meds-d); }
  .notif-for.patient { background: var(--c-pat);  color: white; }
 
  .notif-title { font-size: 16px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .notif-text { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.4; margin-bottom: 10px; }
 
  .notif-detail-card {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 8px 11px;
    margin-bottom: 10px;
  }
  .notif-detail-row {
    display: flex; justify-content: space-between;
    font-size: 11px; padding: 3px 0;
  }
  .notif-detail-key { color: rgba(255,255,255,0.5); }
  .notif-detail-val { font-weight: 600; }
 
  .notif-actions {
    padding: 0 12px 12px;
    display: flex; flex-direction: column; gap: 6px;
    flex-shrink: 0;
  }
  .notif-action-btn {
    width: 100%;
    background: rgba(255,255,255,0.12);
    color: white; border: none;
    padding: 9px 11px;
    border-radius: 12px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, transform 0.1s;
  }
  .notif-action-btn:hover { background: rgba(255,255,255,0.18); }
  .notif-action-btn:active { transform: scale(0.97); }
  .notif-action-btn.primary        { background: var(--c-meds);  color: var(--c-meds-d); }
  .notif-action-btn.primary-blue   { background: var(--c-appts); color: white; }
  .notif-action-btn.primary-amber  { background: var(--c-inv);   color: var(--c-inv-d); }
  .notif-action-btn.primary-purple { background: var(--c-pat);   color: white; }
  .notif-action-btn.danger { background: rgba(255,69,58,0.2); color: var(--c-warn); }
 
  /* ───── SIMPLE MED NOTIFICATION LAYOUT ─────
     Only: small "حان موعد دوائك" label, BIG medication name, BIG time */
  .notif-simple {
    padding: 14px 16px 8px;
    text-align: center;
  }
  .notif-simple-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    margin-bottom: 12px;
  }
  .notif-simple-name {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .notif-simple-time {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--c-meds);
    font-feature-settings: "tnum";
  }
  .notif-simple.appts .notif-simple-time { color: var(--c-appts); }
  .notif-simple.patient .notif-simple-time { color: var(--c-pat); }
  .notif-simple-sub {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    margin-top: 6px;
  }
  .notif-simple-for {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 7px;
    margin-top: 12px;
    display: inline-block;
  }
  .notif-simple-for.me      { background: var(--c-meds); color: var(--c-meds-d); }
  .notif-simple-for.patient { background: var(--c-pat);  color: white; }
 
  /* ───── ESCORT NOTIFICATION LAYOUT ─────
     Patient name + appointment details + reminder note */
  .notif-escort { padding: 12px 14px 8px; }
  .notif-escort-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .notif-escort-card {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .notif-escort-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    align-items: baseline;
  }
  .notif-escort-key { color: rgba(255,255,255,0.55); font-weight: 500; }
  .notif-escort-val { font-weight: 700; }
  .notif-escort-note {
    background: rgba(255,159,10,0.15);
    border: 1px solid rgba(255,159,10,0.35);
    color: var(--c-inv);
    font-size: 11px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 10px;
    line-height: 1.4;
    text-align: center;
  }
 
  /* Countdown badge inside simple notification (for appointments) */
  .notif-simple-countdown {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 10px;
    margin: 8px 0 4px;
    background: rgba(10,132,255,0.18);
    color: var(--c-appts);
  }
  .notif-simple.patient .notif-simple-countdown {
    background: rgba(191,90,242,0.2);
    color: var(--c-pat);
  }
 
  /* ───── CLINIC LAYOUT WITH ROOM + DOCTOR ───── */
  .notif-clinic-minimal {
    padding: 14px 14px 8px;
    text-align: center;
  }
  .notif-clinic-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .notif-clinic-room {
    font-size: 28px;
    font-weight: 800;
    color: var(--c-pat);
    line-height: 1.05;
    margin-bottom: 4px;
  }
  .notif-clinic-doctor {
    font-size: 14px;
    font-weight: 600;
    color: white;
    margin-bottom: 2px;
  }
  .notif-clinic-dept {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
  }
 
  /* ───── LOW STOCK LAYOUT ───── */
  .notif-stock {
    padding: 14px 16px 8px;
    text-align: center;
  }
  .notif-stock-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--c-warn);
    margin-bottom: 10px;
  }
  .notif-stock-name {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .notif-stock-days {
    font-size: 26px;
    font-weight: 800;
    color: var(--c-inv);
    line-height: 1;
    margin-bottom: 8px;
  }
  .notif-stock-note {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    line-height: 1.4;
  }
 
  /* ───── MISSED DOSE LAYOUT ───── */
  .notif-missed {
    padding: 14px 16px 8px;
    text-align: center;
  }
  .notif-missed-warning {
    font-size: 12px;
    font-weight: 700;
    color: var(--c-warn);
    margin-bottom: 10px;
  }
  .notif-missed-name {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .notif-missed-med {
    font-size: 16px;
    font-weight: 600;
    color: var(--c-pat);
    margin-bottom: 8px;
  }
  .notif-missed-time {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
  }
 
  /* ───── RECORDING OVERLAY ───── */
  .record-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 15;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    animation: slideDown 0.3s ease;
  }
  .record-overlay.active { display: flex; }
 
  .record-status {
    font-size: 12px;
    font-weight: 600;
    color: var(--c-warn);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .record-status::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--c-warn);
    border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }
 
  /* Waveform bars */
  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 50px;
    margin-bottom: 18px;
  }
  .wave-bar {
    width: 4px;
    background: var(--c-meds);
    border-radius: 2px;
    animation: wave 0.9s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { animation-delay: 0.0s; height: 14px; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 28px; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 38px; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 48px; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 32px; }
  .wave-bar:nth-child(6) { animation-delay: 0.5s; height: 42px; }
  .wave-bar:nth-child(7) { animation-delay: 0.6s; height: 22px; }
  .wave-bar:nth-child(8) { animation-delay: 0.5s; height: 34px; }
  .wave-bar:nth-child(9) { animation-delay: 0.4s; height: 26px; }
  .wave-bar:nth-child(10){ animation-delay: 0.3s; height: 16px; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1.0); }
  }
 
  .record-timer {
    font-size: 30px;
    font-weight: 800;
    font-feature-settings: "tnum";
    margin-bottom: 22px;
    color: white;
  }
  .record-stop-btn {
    background: var(--c-warn);
    border: none;
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 0 0 4px rgba(255,69,58,0.25);
    transition: transform 0.15s;
  }
  .record-stop-btn:active { transform: scale(0.92); }
  .record-stop-btn::after {
    content: '';
    width: 22px; height: 22px;
    background: white;
    border-radius: 4px;
  }
 
  /* ───── DOCUMENTS VIEW (recordings list) ───── */
  .doc-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .doc-empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
    opacity: 0.55;
  }
  .doc-empty-text {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    line-height: 1.4;
  }
 
  .doc-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    margin-bottom: 6px;
  }
  .doc-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--c-meds);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .doc-icon svg { width: 18px; height: 18px; fill: var(--c-meds-d); }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
  }
  .doc-meta {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .doc-play {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,230,118,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s;
  }
  .doc-play:hover { background: rgba(0,230,118,0.3); }
  .doc-play svg { width: 11px; height: 11px; fill: var(--c-meds); margin-inline-start: 1px; }
 
  /* Highlight newly-added document */
  .doc-item.new {
    animation: docHighlight 1.8s ease;
  }
  @keyframes docHighlight {
    0%   { background: rgba(0,230,118,0.4); transform: scale(1.02); }
    100% { background: rgba(255,255,255,0.06); transform: scale(1); }
  }
 
  /* DOCS menu icon color */
  .menu-c-docs { background: var(--c-docs); box-shadow: 0 6px 18px rgba(48,176,199,0.35); }
 
  /* CONFIRMATION SCREEN */
  .confirmation {
    position: absolute; inset: 0;
    background: #000;
    z-index: 21;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    text-align: center;
    animation: confirmIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .confirmation.active { display: flex; }
  @keyframes confirmIn {
    0%   { opacity: 0; transform: scale(0.85); }
    60%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
 
  .confirm-emoji {
    font-size: 56px; line-height: 1;
    margin-bottom: 12px;
    animation: bounce 0.6s ease;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .confirm-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; }
  .confirm-msg { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.4; max-width: 220px; }
  .confirm-meta {
    margin-top: 12px;
    background: rgba(255,255,255,0.08);
    padding: 5px 11px; border-radius: 9px;
    font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 600;
  }
  .confirmation.meds  .confirm-title { color: var(--c-meds); }
  .confirmation.appts .confirm-title { color: var(--c-appts); }
  .confirmation.amber .confirm-title { color: var(--c-inv); }
  .confirmation.purple .confirm-title { color: var(--c-pat); }
  .confirmation.danger .confirm-title { color: var(--c-warn); }
 
  /* CONTROL CENTER */
  .control-center { position: absolute; inset: 0; background: rgba(10,10,12,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 10; display: none; flex-direction: column; padding: 10px 12px 12px; animation: ccIn 0.22s ease; }
  @keyframes ccIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .control-center.active { display: flex; }
  .cc-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .cc-battery-wrap { display: flex; align-items: center; gap: 5px; }
  .cc-battery-icon { width: 22px; height: 11px; border: 1px solid rgba(255,255,255,0.45); border-radius: 2px; padding: 1px; position: relative; }
  .cc-battery-icon::after { content: ''; position: absolute; right: -3px; top: 2px; width: 1.5px; height: 5px; background: rgba(255,255,255,0.45); border-radius: 0 1px 1px 0; }
  .cc-battery-fill { height: 100%; width: 87%; background: var(--c-meds); border-radius: 1px; }
  .cc-battery-text { color: var(--c-meds); font-size: 13px; font-weight: 600; }
  .cc-close { background: rgba(255,255,255,0.12); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 16px; padding: 0; font-family: inherit; }
  .cc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: 1; align-content: center; justify-items: center; }
  .cc-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(255,255,255,0.85); padding: 0; }
  .cc-btn[data-active="true"] { background: #fff; color: #000; }
  .cc-btn svg { width: 24px; height: 24px; }
 
  .helper { text-align: center; color: #4a4a50; font-size: 14px; max-width: 360px; line-height: 1.65; }
  .helper b { color: #00b25b; font-weight: 600; }
  .helper-row { display: block; margin-top: 4px; font-size: 13px; color: #6a6a70; }


  /* ═══ MATCHED TO SEHATNA WEBSITE IDENTITY ═══ */
  .status-time, .brand-name, .brand-time { color: var(--green); }
  .brand-mic svg, .mic-btn svg { fill: var(--green); }
  .app-phone, .app-msg { background: var(--green); }
  .app-mail, .app-weather { background: var(--blue); }
  .app-music, .app-news, .app-heart { background: var(--pink); }
  .app-podcasts { background: var(--red); }
  .app-sehetna { background: var(--green); box-shadow: 0 0 0 2px rgba(20,89,60,.30); }
  .app-notif-home { background: var(--pink); box-shadow: 0 0 0 2px rgba(219,39,119,.30); }
  .menu-c-meds  { background: var(--green); box-shadow: 0 6px 18px rgba(20,89,60,.40); }
  .menu-c-appts { background: var(--blue); box-shadow: 0 6px 18px rgba(37,99,235,.38); }
  .menu-c-inv   { background: var(--pink); box-shadow: 0 6px 18px rgba(219,39,119,.36); }
  .menu-c-docs  { background: var(--green); box-shadow: 0 6px 18px rgba(20,89,60,.40); }
  .menu-c-notif { background: var(--pink); box-shadow: 0 6px 18px rgba(219,39,119,.36); }
  .v-dot.active { background: var(--green); }

  .person-avatar { color: #fff; }
  .avatar-saraa    { background: var(--pink); }
  .avatar-father   { background: var(--blue); }
  .avatar-bro      { background: var(--green); }
  .avatar-mother   { background: var(--red); }
  .avatar-daughter { background: var(--red); }
  .tag-saraa    { background: var(--pink); color: #fff; }
  .tag-father   { background: var(--blue); color: #fff; }
  .tag-bro      { background: var(--green); color: #fff; }
  .tag-mother   { background: var(--red); color: #fff; }
  .tag-daughter { background: var(--red); color: #fff; }

  /* Each page follows its person's site color */
  .family-page .hero-meds,
  .family-page .hero-appts { background: var(--person-color); color: #fff; }
  .family-page .med-time-badge {
    background: var(--person-soft);
    color: var(--person-color);
  }
  .family-page .med-item.taken .med-check {
    background: var(--person-color);
    border-color: var(--person-color);
  }
  .family-page .inv-bar-fill.high { background: var(--person-color); }
  .family-page .inv-card.low .inv-bar-fill { background: var(--c-warn); }
  .family-page .hero-warn { background: var(--c-warn); color: #fff; }
  .family-page .person-name { font-weight: 800; }
  .family-page .person-rel { opacity: .65; }
  .family-page .person-tag { color: #fff; }
  .family-page .med-check svg { fill: #fff; }

  .docs-theme .back-btn, .docs-theme .app-title { color: var(--green); }
  .doc-icon { background: var(--green); }
  .doc-icon svg { fill: #fff; }
  .doc-play { background: rgba(20,89,60,.20); }
  .doc-play svg { fill: var(--green); }
  .helper b { color: var(--green); }



  /* ═══ WATCH FACE — first screen ═══ */
  .watchface-view {
    position: absolute;
    inset: 0;
    height: 100%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(20,89,60,0.16), transparent 34%),
      radial-gradient(circle at 50% 50%, #07120d 0%, #000 70%);
    cursor: pointer;
    user-select: none;
  }
  .watchface-top {
    position: absolute;
    top: 16px;
    right: 20px;
    left: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: rgba(255,255,255,0.66);
    direction: rtl;
  }
  .watchface-brand {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--green-soft);
    font-weight: 700;
  }
  .watchface-brand-mark {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--green);
    display: grid; place-items: center;
  }
  .watchface-brand-mark svg { width: 9px; height: 9px; fill: white; }
  .watchface-date {
    font-size: 13px;
    color: var(--green-soft);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .watchface-time {
    direction: ltr;
    font-size: 50px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    color: white;
    font-variant-numeric: tabular-nums;
  }
  .watchface-period {
    font-size: 12px;
    font-weight: 700;
    color: var(--green-soft);
    letter-spacing: 0;
    margin-right: 4px;
  }
  .watchface-complications {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }
  .watchface-complication {
    min-width: 76px;
    padding: 8px 9px;
    border-radius: 12px;
    border: 1px solid rgba(209,231,220,0.16);
    background: rgba(20,89,60,0.12);
    text-align: center;
  }
  .watchface-complication .label {
    font-size: 9.5px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 3px;
  }
  .watchface-complication .value {
    font-size: 12px;
    color: var(--green-soft);
    font-weight: 700;
  }
  .watchface-open-hint {
    position: absolute;
    bottom: 18px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.48);
    display: flex; align-items: center; gap: 5px;
  }
  .watchface-open-hint::before {
    content: '';
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(20,89,60,.18);
  }

  /* ═══ APPLE WATCH-STYLE EMERGENCY SOS PROTOTYPE ═══ */
  .sos-overlay {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: #000;
    color: #fff;
    display: none;
    flex-direction: column;
    padding: 16px 14px 14px;

    background: rgba(209,231,220,.26);
    transition: all .18s ease;
  }
  .alert-dot.active {
    width: 17px;
    border-radius: 999px;
    background: #D1E7DC;
  }
  .alert-page-num {
    position: absolute;
    bottom: 12px;
    right: 48px;
    left: 48px;
    pointer-events: none;
    color: transparent;
  }


  /* ═══ COMPACT NEXT MEDICATION COMPLICATION ═══ */
  .next-med-card { display: none !important; }
  .next-med-alert {
    width: 176px;
    min-height: 48px;
    margin-top: 20px;
    padding: 8px 9px;
    border-radius: 15px;
    border: 1px solid rgba(209,231,220,.16);
    background: rgba(16,23,20,.95);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: right;
    font-family: inherit;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease, transform .12s ease;
  }
  .next-med-alert:hover {
    background: #14211C;
    border-color: rgba(209,231,220,.32);
  }
  .next-med-alert:active { transform: scale(.98); }
  .next-med-alert-icon {
    width: 29px;
    height: 29px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: #14593C;
    color: #FFFFFF;
    flex: none;
  }
  .next-med-alert-icon svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
  .next-med-alert-copy {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .next-med-alert-label {
    font-size: 11px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.15;
  }
  .next-med-alert-remaining {
    font-size: 10.5px;
    font-weight: 700;
    color: #D1E7DC;
    line-height: 1.15;
  }
  .next-med-alert-chevron {
    flex: none;
    font-size: 19px;
    line-height: 1;
    color: #D1E7DC;
    transform: rotate(180deg);
  }


  /* ═══ FINAL UX REFINEMENTS: concise complication + clean contextual pages + fitted alerts ═══ */
  .next-med-alert {
    width: 154px;
    min-height: 41px;
    margin-top: 18px;
    padding: 7px 9px;
    gap: 7px;
  }
  .next-med-alert-icon {
    width: 27px;
    height: 27px;
    border-radius: 9px;
  }
  .next-med-alert-chevron { display: none !important; }
  .next-med-alert-remaining {
    font-size: 10px;
  }

  .page-identity { display: none !important; }
  .family-page .v-scroll {
    padding-top: 10px;
  }

  .incoming-content.is-details {
    justify-content: flex-start;
    padding: 7px 12px 3px;
  }
  .incoming-content.is-details .incoming-label {
    margin-bottom: 7px;
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 800;
  }
  .incoming-detail-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .incoming-grid-cell {
    min-width: 0;
    min-height: 38px;
    padding: 5px 7px;
    border-radius: 9px;
    background: #101714;
    border: 1px solid rgba(209,231,220,.13);
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: right;
  }
  .incoming-grid-cell .k {
    color: #AFC3BA;
    font-size: 8.7px;
    font-weight: 700;
  }
  .incoming-grid-cell .v {
    color: #FFFFFF;
    font-size: 9.8px;
    font-weight: 700;
    line-height: 1.25;
  }
  .incoming-actions {
    padding: 4px 12px 5px;
  }
  .incoming-action {
    min-height: 31px;
    padding: 5px 6px;
    font-size: 10.4px;
  }
  .alert-preview-nav {
    padding: 0 12px 7px;
  }
  .alert-nav-btn {
    width: 24px;
    height: 24px;
    font-size: 16px;
  }
  .alert-counter {
    font-size: 10px;
    font-weight: 700;
    color: #AFC3BA;
    direction: ltr;
  }


  /* ═══ Appointment date refinement ═══ */
  .appointment-hero .hero-time {
    margin-bottom: 7px;
  }
  .appointment-hero .appt-date-line {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 5px 0 6px;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(209,231,220,.12);
    border: 1px solid rgba(209,231,220,.18);
    color: var(--watch-text-secondary);
    font-size: 14px;
    font-weight: 800;
    line-height: 1.25;
  }
  .appointment-hero .hero-sub {
    margin-top: 0;
    font-size: 12px;
    color: var(--watch-text-muted);
  }


  /* ═══ Font restored to the original UI typeface ═══ */
  body,
  button,
  input,
  textarea,
  select,
  .display,
  .watch,
  .brand-header,
  .app-header,
  .hero,

  .appointment-hero .appt-date-line {
    font-weight: 700;
    letter-spacing: 0;
  }


  /* Clickable next medication hero */
  .hero-med-clickable {
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .hero-med-clickable:hover {
    background: #14211C;
    border-color: rgba(209,231,220,.30);
  }
  .hero-med-clickable:active {
    transform: scale(.985);
  }
  .hero-med-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .hero-med-copy {
    flex: 1;
    min-width: 0;
  }
  .hero-med-check {
    width: 24px;
    height: 24px;
    flex: none;
    background: rgba(255,255,255,.04);
    border-color: rgba(209,231,220,.42);
  }
  .hero-med-check svg {
    width: 14px;
    height: 14px;
    fill: #FFFFFF;
    opacity: 0;
  }
  .hero-med-clickable:hover .hero-med-check {
    background: rgba(209,231,220,.10);
    border-color: rgba(209,231,220,.78);
  }
  .hero-med-clickable:active .hero-med-check {
    background: var(--watch-green);
    border-color: var(--watch-green);
  }
  .hero-med-clickable:active .hero-med-check svg {
    opacity: 1;
  }

</style>

<script>
  // ───── DATA: نفس شخصيات منصة صحتنا ─────
  const PEOPLE = [
    { key: 'me',       name: 'سارة (أنا)',       short: 'سارة',    rel: 'حسابي',          letter: 'س', color: '#DB2777' },
    { key: 'father',   name: 'الوالد (عبدالله)', short: 'عبدالله', rel: 'الوالد · مساند', letter: 'ا', color: '#2563EB' },
    { key: 'bro',      name: 'أحمد (الأخ)',      short: 'أحمد',    rel: 'الأخ · مساند',   letter: 'ا', color: '#14593C' },
    { key: 'mother',   name: 'نورة (الوالدة)',   short: 'نورة',    rel: 'الوالدة · مساند',letter: 'ن', color: '#E11D48' },
    { key: 'daughter', name: 'ليلى (الابنة)',    short: 'ليلى',    rel: 'الابنة',         letter: 'ل', color: '#E11D48' }
  ];

  const medsByPerson = {
    me: [
      { time: '8:00 ص', name: 'بانادول 500', dose: 'بعد الفطور', taken: true },
      { time: '1:00 م', name: 'فيتامين D', dose: 'حبة واحدة', taken: false },
      { time: '9:00 م', name: 'أملوديبين 5', dose: 'لضغط الدم', taken: false }
    ],
    father: [
      { time: '7:00 ص', name: 'أسبرين 81', dose: 'مسيّل دم', taken: true },
      { time: '1:00 م', name: 'لازكس 40', dose: 'مدر بول', taken: false },
      { time: '8:00 م', name: 'وارفارين', dose: 'حبة', taken: false }
    ],
    bro: [
      { time: '9:00 ص', name: 'فيتامين C', dose: 'حبة واحدة', taken: true },
      { time: '7:00 م', name: 'بروفين 400', dose: 'بعد الأكل', taken: false }
    ],
    mother: [
      { time: '8:30 ص', name: 'ليفوثيروكسين', dose: 'قبل الفطور', taken: true },
      { time: '9:00 م', name: 'كالسيوم', dose: 'حبة واحدة', taken: false }
    ],
    daughter: [
      { time: '7:30 ص', name: 'فيتامينات أطفال', dose: 'حبة مضغ', taken: false }
    ]
  };

  const apptsByPerson = {
    me:       { date: 'اليوم — الخميس 30 أبريل', hospital: 'مستشفى الملك فيصل التخصصي', dept: 'نساء وولادة', time: '9:30 ص' },
    father:   { date: 'اليوم — الخميس 30 أبريل', hospital: 'مستشفى الأمير سلطان', dept: 'أمراض القلب', time: '11:00 ص' },
    bro:      { date: 'السبت 2 مايو', hospital: 'مجمع إرادة', dept: 'طب عام', time: '5:00 م' },
    mother:   { date: 'الأحد 3 مايو', hospital: 'مستشفى الحرس', dept: 'الباطنة', time: '10:00 ص' },
    daughter: { date: 'الاثنين 4 مايو', hospital: 'مركز صحي الروضة', dept: 'الأطفال', time: '8:30 ص' }
  };

  const inventoryByPerson = {
    me: [
      { name: 'ميتفورمين 500', current: 4, total: 60, days: 4, low: true },
      { name: 'فيتامين D', current: 18, total: 30, days: 18, low: false },
      { name: 'أملوديبين 5', current: 22, total: 30, days: 22, low: false }
    ],
    father: [
      { name: 'وارفارين', current: 5, total: 30, days: 5, low: true },
      { name: 'أسبرين 81', current: 12, total: 30, days: 12, low: false },
      { name: 'أنسولين', current: 18, total: 30, days: 9, low: false }
    ],
    bro: [
      { name: 'فيتامين C', current: 16, total: 30, days: 16, low: false },
      { name: 'بروفين 400', current: 6, total: 20, days: 6, low: true }
    ],
    mother: [
      { name: 'ليفوثيروكسين', current: 14, total: 30, days: 14, low: false },
      { name: 'كالسيوم', current: 8, total: 30, days: 8, low: false }
    ],
    daughter: [
      { name: 'فيتامينات أطفال', current: 11, total: 30, days: 11, low: false }
    ]
  };

  const SECTION_LABELS = {
    meds: 'أدوية',
    appts: 'مواعيد',
    inventory: 'مخزون'
  };

  let activeViewName = 'face';
  const currentPageIndex = {
    meds: 0,
    appts: 0,
    inventory: 0
  };

  function getActivePersonIndex() {
    if (activeViewName === 'appts') return currentPageIndex.appts || 0;
    if (activeViewName === 'meds') return currentPageIndex.meds || 0;
    if (activeViewName === 'inventory') return currentPageIndex.inventory || 0;
    return 0;
  }

  function getRecordingAppointment() {
    const person = PEOPLE[getActivePersonIndex()] || PEOPLE[0];
    const appointment = apptsByPerson[person.key] || apptsByPerson.me;
    return { person, appointment };
  }

  function buildRecordingName() {
    const { person, appointment } = getRecordingAppointment();
    const owner = person.key === 'me' ? 'موعدي' : `موعد ${person.short}`;
    return `${owner} — ${appointment.hospital} — ${appointment.dept}`;
  }

  function contextualSectionTitle(sectionKey, person) {
    if (person.key === 'me') {
      return { meds: 'أدويتي', appts: 'مواعيدي', inventory: 'مخزوني' }[sectionKey];
    }
    return `${SECTION_LABELS[sectionKey]} ${person.short}`;
  }

  function updateSectionTitle(sectionKey, person) {
    const title = document.getElementById(`${sectionKey}-title`);
    if (!title) return;
    title.innerHTML = `<span class="context-dot" style="background:${person.color}"></span>${contextualSectionTitle(sectionKey, person)}`;
  }

  function renderDots(dotsId) {
    document.getElementById(dotsId).innerHTML = PEOPLE.map((_, i) =>
      `<span class="dot ${i === 0 ? 'active' : ''}"></span>`
    ).join('');
  }

  function bindPageDots(containerId, dotsId, sectionKey) {
    const container = document.getElementById(containerId);
    const pages = container.querySelectorAll('.h-page');
    const dots = document.querySelectorAll(`#${dotsId} .dot`);
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.intersectionRatio >= 0.6) {
          const index = Array.from(pages).indexOf(entry.target);
          if (index < 0) return;
          dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
          currentPageIndex[sectionKey] = index;
          updateSectionTitle(sectionKey, PEOPLE[index]);
        }
      });
    }, { root: container, threshold: 0.6 });
    pages.forEach(page => observer.observe(page));
  }

  function renderPeoplePages(containerId, dotsId, sectionKey, renderBody) {
    const container = document.getElementById(containerId);
    container.innerHTML = PEOPLE.map(person => `
      <div class="h-page family-page" aria-label="${contextualSectionTitle(sectionKey, person)}">
        <div class="v-scroll">${renderBody(person)}</div>
      </div>`).join('');
    renderDots(dotsId);
    currentPageIndex[sectionKey] = 0;
    updateSectionTitle(sectionKey, PEOPLE[0]);
    bindPageDots(containerId, dotsId, sectionKey);
  }

  function renderMeds() {
    renderPeoplePages('meds-pages', 'meds-dots', 'meds', person => medContent(medsByPerson[person.key], person.key));
  }

  function medContent(list, personKey) {
    const pending = list.filter(m => !m.taken);
    const taken = list.filter(m => m.taken);
    const nextIndex = list.findIndex(m => !m.taken);
    const next = nextIndex >= 0 ? list[nextIndex] : null;
    let out = '';
    if (next) {
      out += `<div class="hero hero-meds hero-med-clickable" onclick="toggleMed('${personKey}', ${nextIndex})" role="button" tabindex="0" aria-label="تسجيل أخذ ${next.name}">
        <div class="hero-med-content">
          <div class="hero-med-copy">
            <div class="hero-label">التذكير القادم · اضغطي للتسجيل</div>
            <div class="hero-time">${next.time}</div>
            <div class="hero-name">${next.name} — ${next.dose}</div>
          </div>
          <div class="med-check hero-med-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        </div>
      </div>`;
    }
    if (pending.length) {
      out += `<div class="section-label">باقي اليوم · ${pending.length}</div>`;
      list.forEach((m, idx) => { if (!m.taken) out += medRow(m, idx, personKey); });
    }
    if (taken.length) {
      out += `<div class="section-label">تم اليوم · ${taken.length}</div>`;
      list.forEach((m, idx) => { if (m.taken) out += medRow(m, idx, personKey); });
    }
    return out;
  }

  function medRow(m, idx, personKey) {
    return `<div class="med-item ${m.taken ? 'taken' : ''}" onclick="toggleMed('${personKey}', ${idx})">
      <div class="med-time-badge">${m.time}</div>
      <div class="med-info">
        <div class="med-name">${m.name}</div>
        <div class="med-dose">${m.dose}</div>
      </div>
      <div class="med-check"><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    </div>`;
  }

  function toggleMed(personKey, idx) {
    const restoreIndex = Math.max(0, PEOPLE.findIndex(person => person.key === personKey));
    medsByPerson[personKey][idx].taken = !medsByPerson[personKey][idx].taken;
    renderMeds();

    // Keep the user on the same person's page after the medicine state changes.
    requestAnimationFrame(() => {
      const container = document.getElementById('meds-pages');
      if (!container) return;
      container.scrollLeft = container.clientWidth * restoreIndex;
      currentPageIndex.meds = restoreIndex;
      document.querySelectorAll('#meds-dots .dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === restoreIndex);
      });
      updateSectionTitle('meds', PEOPLE[restoreIndex]);
    });
  }

  function renderAppts() {
    renderPeoplePages('appts-pages', 'appts-dots', 'appts', person => apptContent(apptsByPerson[person.key]));
  }

  function apptContent(a) {
    return `<div class="hero hero-appts appointment-hero">
      <div class="hero-label">الموعد القادم</div>
      <div class="hero-time">${a.time}</div>
      <div class="hero-name">${a.hospital}</div>
      <div class="appt-date-line">${a.date}</div>
      <div class="hero-sub">${a.dept}</div>
    </div>`;
  }

  function renderInventory() {
    renderPeoplePages('inv-pages', 'inv-dots', 'inventory', person => invContent(inventoryByPerson[person.key]));
  }

  function invContent(list) {
    const sorted = [...list].sort((a, b) => a.days - b.days);
    const lowCount = list.filter(i => i.low).length;
    let out = '';
    if (lowCount > 0) {
      const c = sorted.find(i => i.low);
      out += `<div class="hero hero-warn">
        <div class="hero-label">⚠ مخزون منخفض</div>
        <div class="hero-time" style="font-size:20px;">${c.name}</div>
        <div class="hero-name">يكفي ${c.days} أيام فقط</div>
      </div>`;
    }
    out += `<div class="section-label">جميع الأدوية · ${list.length}</div>`;
    sorted.forEach(item => {
      const pct = (item.current / item.total) * 100;
      const cls = item.low ? '' : (pct > 50 ? 'high' : '');
      out += `<div class="inv-card ${item.low ? 'low' : ''}">

        <div class="inv-days">${item.low ? '⚠ يكفي ' : 'يكفي '}${item.days} أيام</div>

    });

  const notifOverlay = document.getElementById('notif-overlay');

  let activeAlertIndex = 0;

  function openIncomingAlert(index = 0) {
    activeAlertIndex = (index + incomingAlerts.length) % incomingAlerts.length;

  function renderIncomingAlert() {
    const alert = incomingAlerts[activeAlertIndex];
    const person = ALERT_PEOPLE[alert.person];

    const detailHtml = alert.details ? `
      <div class="incoming-detail-grid">
        ${alert.details.map(row => `<div class="incoming-grid-cell"><span class="k">${row[0]}</span><span class="v">${row[1]}</span></div>`).join('')}
      </div>` : '';

    const actionsHtml = alert.actions.map(action => `
      <button class="incoming-action ${action.kind}" onclick="handleAlertAction('${action.confirm}')">${action.label}</button>
    `).join('');

    const isDetails = alert.layout === 'details';

    notifOverlay.innerHTML = `
      <div class="incoming-head">
        <span class="incoming-avatar" style="background:${person.color}">${person.letter}</span>
        <div class="incoming-person">

          <span class="incoming-badge ${alert.urgent ? 'urgent' : ''}">${alert.type}</span>
        </div>
      </div>

        <button class="alert-nav-btn" onclick="nextIncomingAlert()" aria-label="التنبيه التالي">›</button>

  function nextIncomingAlert() {

    if (key === 'close-alert') {

      return;

    notifOverlay.classList.remove('active');

    const delta = event.changedTouches[0].clientX - alertSwipeStartX;
    if (Math.abs(delta) > 36) {
      delta < 0 ? nextIncomingAlert() : previousIncomingAlert();
    }
    alertSwipeStartX = null;
  }, { passive: true });


  // ───── NAVIGATION ─────
  const VIEWS = ['face','home','menu','meds','appts','inventory','docs'];
  // Views that belong to the Sehetna app (will hide the global status bar)
  const SEHETNA_VIEWS = ['menu','meds','appts','inventory','docs'];
 
  function showView(name) {
    activeViewName = name;
    VIEWS.forEach(v => {
      const el = document.getElementById(v + '-view');
      if (!el) return;
      el.style.display = (v === name) ? (v === 'home' ? 'block' : 'flex') : 'none';

    // Hide global status bar when inside Sehetna so brand header (with time) takes its place

    display.classList.toggle('in-app', SEHETNA_VIEWS.includes(name));
 
    document.getElementById('control-center').classList.remove('active');
    document.getElementById('sos-overlay').classList.remove('active');
    clearInterval(sosTimer);
    notifOverlay.classList.remove('active');
    confirmation.classList.remove('active');
    document.querySelectorAll('.v-scroll').forEach(s => s.scrollTop = 0);
 
    if (name === 'menu')      resetMenuSnap();
    if (name === 'meds')      { renderMeds();      resetPages('meds-pages', 'meds-dots'); }
    if (name === 'appts')     { renderAppts();     resetPages('appts-pages', 'appts-dots'); }
    if (name === 'inventory') { renderInventory(); resetPages('inv-pages', 'inv-dots'); }

        d.classList.toggle('active', i === 0);

  function startSOSCountdown() {

      sosSeconds -= 1;

        clearInterval(sosTimer);
        document.getElementById('sos-overlay').classList.remove('active');

        confirmation.innerHTML = '<div class="confirm-emoji">🆘</div><div class="confirm-title">تم تفعيل الاستغاثة</div><div class="confirm-msg">محاكاة: تم إرسال نداء الطوارئ ومشاركة الموقع مع جهات الاتصال.</div><div class="confirm-meta">نموذج تجريبي — لا يوجد اتصال فعلي</div>';

  function updateNextMedicationRemaining() {
    const remainingEl = document.getElementById('next-med-remaining');
    if (!remainingEl) return;

    const riyadhParts = new Intl.DateTimeFormat('en-US', {
      year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric',
      hour12: false, timeZone: 'Asia/Riyadh'
    }).formatToParts(new Date()).reduce((acc, part) => {
      if (part.type !== 'literal') acc[part.type] = Number(part.value);
      return acc;
    }, {});

    const nowMinutes = riyadhParts.hour * 60 + riyadhParts.minute;
    const medicationMinutes = 13 * 60;
    let minutesLeft = medicationMinutes - nowMinutes;
    if (minutesLeft <= 0) minutesLeft += 24 * 60;

    const hours = Math.floor(minutesLeft / 60);
    const minutes = minutesLeft % 60;
    const arNumber = value => new Intl.NumberFormat('ar-SA').format(value);

    if (hours === 0) {
      remainingEl.textContent = `بعد ${arNumber(minutes)} د`;
    } else {
      remainingEl.textContent = `بعد ${arNumber(hours)} س`;
    }
  }

  function updateWatchFace() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('ar-SA', {
      hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Riyadh'
    }).formatToParts(now);
    const hour = parts.find(p => p.type === 'hour')?.value || '09';
    const minute = parts.find(p => p.type === 'minute')?.value || '41';
    const dayPeriod = parts.find(p => p.type === 'dayPeriod')?.value || '';
    document.getElementById('face-time').textContent = `${hour}:${minute}`;
    document.getElementById('face-period').textContent = dayPeriod;
    updateNextMedicationRemaining();
    document.getElementById('face-date').textContent = new Intl.DateTimeFormat('ar-SA', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Asia/Riyadh'
    }).format(now);
  }
  function toggleBtn(b)     { b.dataset.active = b.dataset.active === 'true' ? 'false' : 'true'; }
 
  function initObservers() {
    // ───── Vertical snap-scroll for main menu (Apple Watch style) ─────
    // On every scroll event, calculate which section is currently snapped:
    //   index = round(scrollTop / clientHeight)
    // Then update the side-dot indicator instantly. The active dot stretches
    // into a capsule shape via CSS transitions (defined on .v-dot).
    const menuSnap = document.getElementById('menu-snap');
    const menuDots = document.querySelectorAll('#menu-side-dots .v-dot');
    if (menuSnap && menuDots.length) {
      menuSnap.addEventListener('scroll', () => {
        const idx = Math.round(menuSnap.scrollTop / menuSnap.clientHeight);
        menuDots.forEach((d, i) => d.classList.toggle('active', i === idx));
      }, { passive: true });
    }
 
    // ───── Horizontal pagination still used inside sub-views (me/patient) ─────
    const sets = [
      ['meds-pages',  'meds-dots'],
      ['appts-pages', 'appts-dots'],
      ['inv-pages',   'inv-dots']
    ];
    sets.forEach(([containerId, dotsId]) => {
      const container = document.getElementById(containerId);
      if (!container) return;
      const pages = container.querySelectorAll('.h-page');
      const dots  = document.querySelectorAll(`#${dotsId} .dot`);
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.intersectionRatio >= 0.6) {
            const idx = Array.from(pages).indexOf(entry.target);
            if (idx >= 0) dots.forEach((d, i) => d.classList.toggle('active', i === idx));
          }
        });
      }, { root: container, threshold: 0.6 });
      pages.forEach(p => observer.observe(p));
    });
  }
  document.addEventListener('DOMContentLoaded', () => {
    initObservers();
    updateWatchFace();
    setInterval(updateWatchFace, 1000);
  });
