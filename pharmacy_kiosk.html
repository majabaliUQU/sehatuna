<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>صحتنا · كايوسك صيدلية النهدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #14593C;
  --green-dark: var(--green-dark);
  --green-light: #E8F1ED;
  --green-soft: #D1E7DC;
  --red: #DC2626;
  --red-light: #FEF2F2;
  --orange: var(--orange);
  --orange-light: #FEF3C7;
  --bg: #F8F8F7;
  --card: #FFFFFF;
  --border: #E5E7EB;
  --border-2: #D1D5DB;
  --text: #1F2937;
  --text-2: #4B5563;
  --text-mute: #6B7280;
}
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   KIOSK ROOT
   ============================================================ */
#kiosk-root {
  background: var(--bg);
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER (unified with hospital kiosk) ===== */
.kk-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 38px;
  flex-shrink: 0;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 3px solid var(--green);
  height: 110px;
}
.kk-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.kk-help-btn {
  background: #DC2626;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  box-shadow: 0 4px 12px -2px rgba(220,38,38,.35);
}
.kk-help-btn:hover {
  background: #B91C1C;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -2px rgba(220,38,38,.45);
}
.kk-help-btn:active { transform: scale(.97); }
.kk-help-btn svg {
  width: 18px;
  height: 18px;
  color: #fff;
}

.kk-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.kk-brand-text {
  text-align: left;
}
.kk-brand-text b {
  display: block;
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 22px;
  color: var(--text);
  line-height: 1.1;
}
.kk-brand-text small {
  display: block;
  font-size: 12px;
  color: var(--text-mute);
  margin-top: 2px;
}
.kk-brand-logo {
  width: 52px;
  height: 52px;
  background: transparent;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.kk-brand-logo svg {
  width: 22px;
  height: 22px;
  color: var(--green);
}

/* ===== MAIN — screens stack ===== */
.kk-main {
  position: relative;
  width: 100%;
  height: 100vh;
}
.kk-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 110px 20px 40px;  /* top padding accounts for the floating header */
  width: 100%;
  height: 100vh;             /* full kiosk height — true vertical center */
  animation: kk-fade .35s ease;
}
.kk-screen.active { display: flex; }
@keyframes kk-fade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   IDLE SCREEN — pharmacy pill icon
   ============================================================ */
.kk-idle { cursor: pointer; }
.kk-idle:hover .kk-tap-circle {
  transform: scale(1.03);
}
.kk-tap-circle {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 24px 60px -16px rgba(20,89,60,.18), 0 0 0 1px rgba(0,0,0,.04);
  margin-bottom: 50px;
  transition: transform .3s cubic-bezier(.2,.9,.3,1.4);
  position: relative;
}
.kk-tap-circle::before {
  content: "";
  position: absolute;
  inset: -10px;
  border: 2px solid rgba(20,89,60,.1);
  border-radius: 50%;
  animation: tap-pulse 2.4s ease-out infinite;
}
@keyframes tap-pulse {
  0% { transform: scale(.95); opacity: 1; }
  100% { transform: scale(1.2); opacity: 0; }
}
.kk-tap-circle svg {
  width: 110px;
  height: 110px;
}
.kk-idle h1 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 52px;
  color: var(--text);
  margin-bottom: 18px;
  text-align: center;
  letter-spacing: -1px;
}
.kk-idle p {
  font-size: 22px;
  color: var(--text-mute);
  font-weight: 400;
  text-align: center;
}

/* ============================================================
   OPTIONS SCREEN — login methods
   ============================================================ */
.kk-options h2 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 42px;
  color: var(--text);
  margin-bottom: 12px;
  text-align: center;
  letter-spacing: -.5px;
}
.kk-options p.sub {
  font-size: 18px;
  color: var(--text-mute);
  margin-bottom: 40px;
  text-align: center;
}
.kk-options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 800px;
  width: 100%;
  margin-bottom: 24px;
}
.kk-option {
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 40px 24px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 16px;
  transition: all .2s;
  font-family: inherit;
}
.kk-option:hover {
  border-color: var(--green);
  transform: translateY(-3px);
  box-shadow: 0 16px 36px -10px rgba(20,89,60,.15);
}
.kk-option.primary {
  border-color: var(--green);
  background: var(--green-light);
}
.kk-option-icon {
  width: 90px;
  height: 90px;
  border-radius: 16px;
  background: var(--green-light);
  display: grid;
  place-items: center;
}
.kk-option.primary .kk-option-icon { background: var(--green); }
.kk-option.primary .kk-option-icon svg { color: #fff; }
.kk-option-icon svg {
  width: 50px;
  height: 50px;
  color: var(--green);
}
.kk-option-title {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 26px;
  color: var(--text);
}
.kk-option-sub {
  font-size: 14px;
  color: var(--text-mute);
  max-width: 260px;
  line-height: 1.5;
}
.kk-cancel-link {
  background: #fff;
  border: 1.5px solid var(--border);
  color: var(--text-mute);
  padding: 12px 28px;
  border-radius: 999px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
  transition: all .15s;
}
.kk-cancel-link:hover {
  border-color: var(--text);
  color: var(--text);
}
.kk-cancel-link svg { width: 16px; height: 16px; }

/* ============================================================
   READING NFC SCREEN
   ============================================================ */
.kk-reading-circle {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: var(--green);
  display: grid;
  place-items: center;
  margin-bottom: 40px;
  position: relative;
  box-shadow: 0 24px 50px -12px rgba(20,89,60,.25);
}
.kk-reading-circle::before,
.kk-reading-circle::after {
  content: "";
  position: absolute;
  inset: -20px;
  border: 3px solid rgba(20,89,60,.25);
  border-radius: 50%;
  animation: reading-pulse 1.8s ease-out infinite;
}
.kk-reading-circle::after { animation-delay: .9s; }
@keyframes reading-pulse {
  0% { transform: scale(.85); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}
.kk-reading-circle svg {
  width: 80px;
  height: 80px;
  color: #fff;
  position: relative;
  z-index: 2;
}
.kk-nfc-waves {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.kk-nfc-waves span {
  position: absolute;
  top: 50%;
  right: -10px;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border: 3px solid transparent;
  border-right-color: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: nfc-wave-out 1.8s ease-out infinite;
}
.kk-nfc-waves span:nth-child(1) { animation-delay: 0s; }
.kk-nfc-waves span:nth-child(2) { animation-delay: .4s; width: 26px; height: 26px; }
.kk-nfc-waves span:nth-child(3) { animation-delay: .8s; width: 40px; height: 40px; }
@keyframes nfc-wave-out {
  0% { opacity: 0; transform: translateY(-50%) translateX(0) scale(.7); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-50%) translateX(30px) scale(1.2); }
}
.kk-reading h2 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 42px;
  color: var(--text);
  margin-bottom: 12px;
}
.kk-reading p {
  font-size: 19px;
  color: var(--text-mute);
}

/* ============================================================
   ID ENTRY (keypad)
   ============================================================ */
.kk-id-entry h2 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 32px;
  color: var(--text);
  margin-bottom: 8px;
}
.kk-id-entry .sub {
  font-size: 15px;
  color: var(--text-mute);
  margin-bottom: 24px;
}
.kk-id-display {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 20px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  min-width: 380px;
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 24px;
  direction: ltr;
}
.kk-id-display .placeholder {
  color: var(--border-2);
  letter-spacing: 4px;
}
.kk-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 380px;
}
.kk-key {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  font-family: 'Tajawal', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all .1s;
}
.kk-key:hover:not(:disabled) {
  background: var(--green-light);
  border-color: var(--green);
}
.kk-key:active:not(:disabled) { transform: scale(.97); }
.kk-key.clear { color: #DC2626; }
.kk-key.submit {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.kk-key.submit:hover:not(:disabled) { background: var(--green-dark); }
.kk-key:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* ============================================================
   VERIFYING SPINNER
   ============================================================ */
.kk-spinner {
  width: 80px;
  height: 80px;
  border: 6px solid var(--green-light);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 32px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.kk-verifying h2 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 36px;
  color: var(--text);
  margin-bottom: 10px;
}
.kk-verifying p {
  font-size: 17px;
  color: var(--text-mute);
}

/* ============================================================
   PRESCRIPTION SCREEN — dependents tabs + Rx card
   ============================================================ */
.kk-rx-screen {
  align-items: stretch !important;
  justify-content: flex-start !important;
  padding: 130px 28px 40px !important;   /* top accounts for header overlay */
  overflow-y: auto;                       /* allow internal scroll if content overflows */
}
.kk-rx-screen-inner {
  max-width: 980px;
  width: 100%;
  margin: 0 auto;
}

/* Dependents row */
/* ===== HORIZONTAL SCROLL WRAPPER WITH ARROW ===== */
.kk-scroll-wrap {
  position: relative;
  margin-bottom: 28px;
}
.kk-scroll-wrap[hidden] { display: none; }

.kk-scroll-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 4px 14px -2px rgba(26,39,48,.15), 0 2px 4px rgba(26,39,48,.06);
  transition: all .2s ease;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
}
.kk-scroll-arrow.left { left: -4px; }
.kk-scroll-arrow.right { right: -4px; }
.kk-scroll-arrow.visible {
  opacity: 1;
  pointer-events: auto;
}
.kk-scroll-arrow:hover {
  transform: translateY(-50%) scale(1.06);
  box-shadow: 0 6px 18px -4px rgba(11,122,63,.3), 0 2px 6px rgba(26,39,48,.08);
  border-color: var(--green);
}
.kk-scroll-arrow:active {
  transform: translateY(-50%) scale(.95);
}
.kk-scroll-arrow svg {
  width: 22px;
  height: 22px;
  color: var(--green);
}
/* Left arrow (positioned on left) — points LEFT by default (matches motion direction) */
.kk-scroll-arrow.left svg { /* default direction — points left */ }
/* Right arrow (positioned on right) — points RIGHT (flipped from default) */
.kk-scroll-arrow.right svg { transform: scaleX(-1); }

/* Hide native scrollbars inside the wrap */
.kk-scroll-wrap .kk-dependents,
.kk-scroll-wrap .kk-suggestions {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.kk-scroll-wrap .kk-dependents::-webkit-scrollbar,
.kk-scroll-wrap .kk-suggestions::-webkit-scrollbar {
  display: none;
}

/* Override the standalone .kk-suggestions scrollbar (no longer needed since wrapped) */
.kk-suggestions {
  scrollbar-width: none !important;
}
.kk-suggestions::-webkit-scrollbar { display: none !important; }

/* Reset margins — now handled by scroll-wrap */
.kk-dependents {
  margin-bottom: 0 !important;
}

.kk-dependents {
  display: flex;
  gap: 12px;
  margin-bottom: 28px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}
.kk-dep-tab {
  background: #fff;
  border: 1px solid transparent;
  border-radius: 16px;
  padding: 14px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all .2s ease;
  font-family: inherit;
  flex-shrink: 0;
  min-width: 220px;
  box-shadow: 0 2px 6px rgba(26,39,48,.04), 0 1px 2px rgba(26,39,48,.02);
}
.kk-dep-tab:hover {
  box-shadow: 0 6px 16px -4px rgba(26,39,48,.12), 0 2px 4px rgba(26,39,48,.06);
  transform: translateY(-1px);
}
.kk-dep-tab.active {
  background: var(--green-light);
  box-shadow: 0 8px 20px -6px rgba(20,89,60,.18), 0 2px 6px rgba(11,122,63,.1);
  transform: translateY(-1px);
}
.kk-dep-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--border);
  display: grid;
  place-items: center;
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--text-mute);
  flex-shrink: 0;
  transition: all .15s;
}
.kk-dep-tab.active .kk-dep-avatar {
  background: var(--green);
  color: #fff;
}
.kk-dep-info {
  flex: 1;
  text-align: right;
}
.kk-dep-name {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
}
.kk-dep-status {
  font-size: 12px;
  color: var(--text-mute);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}
.kk-dep-tab.active .kk-dep-status { color: var(--green); }
.kk-dep-status .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.kk-dep-status.empty .dot { background: var(--border-2); }
.kk-dep-status.empty { color: var(--text-mute); }

/* Active patient label */
.kk-rx-active {
  margin-bottom: 18px;
  text-align: right;
}
.kk-rx-active h2 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 30px;
  color: var(--text);
  margin-bottom: 4px;
}
.kk-rx-active h2 .name { color: var(--green); }
.kk-rx-active-status {
  font-size: 14px;
  color: var(--text-mute);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.kk-rx-active-status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}

/* Prescription card */
.kk-rx-card {
  background: #fff;
  border: 2px solid var(--green);
  border-radius: 14px;
  padding: 22px 24px;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas:
    "icon details"
    "dispense dispense";
  gap: 20px;
  align-items: start;
  margin-bottom: 28px;
  box-shadow: 0 8px 24px -8px rgba(20,89,60,.1);
}
.kk-rx-card .kk-rx-icon { grid-area: icon; }
.kk-rx-card .kk-rx-details { grid-area: details; }
.kk-rx-card .kk-dispense-btn { grid-area: dispense; }
.kk-rx-icon {
  min-width: 96px;
  height: 80px;
  padding: 0 18px;
  border-radius: 14px;
  background: var(--green);
  display: grid;
  place-items: center;
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 22px;
  color: #fff;
  letter-spacing: -.3px;
  box-shadow: 0 4px 12px -4px rgba(20,89,60,.25);
}
.kk-rx-details { text-align: right; }
.kk-rx-number {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 22px;
  color: var(--text);
  margin-bottom: 6px;
  direction: ltr;
  text-align: right;
}
.kk-rx-doctor {
  font-size: 14px;
  color: var(--text-mute);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
}
.kk-rx-doctor svg {
  width: 14px;
  height: 14px;
}

/* Medicines list — one per line, with icon */
.kk-rx-meds {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.kk-rx-med {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  flex-direction: row-reverse;
}
.kk-rx-med-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.kk-rx-med-icon svg { width: 22px; height: 22px; color: var(--green); }
.kk-rx-med-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: right;
}
.kk-rx-med-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  /* Natural RTL: name on right side, dose-badge on left side */
}
.kk-rx-med-name {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: var(--text);
}
.kk-rx-med-dose-badge {
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--green);
  background: var(--green-light);
  border: 1px solid rgba(20,89,60,.15);
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.kk-rx-med-row {
  display: flex;
  align-items: center;
  gap: 8px;
  /* In RTL, default flex direction puts first child on the right, 
     which is what we want: icon on right, text flowing leftward */
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
  justify-content: flex-start;
}
.kk-rx-med-row .ic {
  width: 14px;
  height: 14px;
  color: var(--text-mute);
  flex-shrink: 0;
}

/* ============================================================
   ADDED SUGGESTIONS — divider + suggestion-style med card
   ============================================================ */
.kk-rx-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 4px 2px;
}
.kk-rx-divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to left, transparent, var(--border) 30%, var(--border) 70%, transparent);
}
.kk-rx-divider-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Tajawal', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #B45309;
  background: var(--orange-light);
  border: 1px solid #fde4c4;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.kk-rx-divider-badge svg {
  width: 11px;
  height: 11px;
  color: #f59e0b;
}

/* Added suggestion — variant of .kk-rx-med */
.kk-rx-med.added-sugg {
  background: #FFFBEB;
  border: 1px solid #fde4c4;
  position: relative;
}
.kk-rx-med.added-sugg .kk-rx-med-icon {
  background: #fff;
  border: 1px solid #fde4c4;
}
/* Use the suggestion's brand color inside its mini icon */
.kk-sugg-mini-icon.vitamins svg { color: #D97706 !important; }
.kk-sugg-mini-icon.skincare svg { color: #db2777 !important; }
.kk-sugg-mini-icon.thermometer svg { color: #2563eb !important; }

/* Price badge (replaces dose badge) */
.kk-rx-med-price-badge {
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: #B45309;
  background: var(--orange-light);
  border: 1px solid #fde4c4;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

/* Consultation badge — full row inside the med info */
.kk-consult-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Tajawal', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  margin-top: 2px;
  line-height: 1.4;
}
.kk-consult-badge svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.kk-consult-badge.needs {
  background: var(--orange-light);
  border: 1px solid #fde4c4;
  color: #B45309;
}
.kk-consult-badge.needs svg { color: #f59e0b; }
.kk-consult-badge.ok {
  background: var(--green-light);
  border: 1px solid rgba(20,89,60,.15);
  color: var(--green-dark);
}
.kk-consult-badge.ok svg { color: var(--green); }

/* Remove (✕) button on added-suggestion rows */
.kk-rx-med-remove {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid #FDE68A;
  background: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  transition: all .2s ease;
}
.kk-rx-med-remove svg {
  width: 12px;
  height: 12px;
  color: #B45309;
}
.kk-rx-med-remove:hover {
  background: var(--orange-light);
  border-color: #f59e0b;
  transform: scale(1.1);
}
.kk-rx-med-remove:active {
  transform: scale(.92);
}

/* Dispense button */
.kk-dispense-btn {
  width: 100%;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 22px 28px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: -.3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 8px 18px -4px rgba(20,89,60,.25);
  white-space: nowrap;
}
.kk-dispense-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 26px -6px rgba(20,89,60,.3);
}
.kk-dispense-btn:active { transform: scale(.97); }

/* Empty state for no prescriptions */
.kk-rx-empty {
  background: #fff;
  border: 2px dashed var(--border-2);
  border-radius: 14px;
  padding: 56px 24px;
  text-align: center;
  margin-bottom: 28px;
}
.kk-rx-empty-icon {
  min-width: 110px;
  height: 80px;
  padding: 0 22px;
  border-radius: 14px;
  background: #f0f1f2;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 24px;
  color: var(--text-mute);
  border: 1px dashed var(--border-2);
}
.kk-rx-empty h3 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: var(--text);
  margin-bottom: 8px;
}
.kk-rx-empty p {
  font-size: 14px;
  color: var(--text-mute);
  line-height: 1.6;
  max-width: 400px;
  margin: 0 auto;
}

/* Suggestions */
.kk-suggestions-toggle {
  width: 100%;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: inherit;
  transition: all .15s;
}
.kk-suggestions-toggle:hover {
  border-color: var(--border-2);
  background: var(--bg);
}
.kk-suggestions-toggle-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-direction: row-reverse;
  text-align: right;
}
.kk-suggestions-toggle .sparkle {
  width: 20px;
  height: 20px;
  color: #f59e0b;
  flex-shrink: 0;
}
.kk-sugg-title {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--text);
}
.kk-sugg-subtitle {
  font-size: 12px;
  color: var(--text-mute);
  margin-top: 2px;
}
.kk-suggestions-toggle .chevron {
  width: 18px;
  height: 18px;
  color: var(--text-mute);
  transition: transform .25s;
  flex-shrink: 0;
}
.kk-suggestions-toggle.open .chevron {
  transform: rotate(180deg);
}
.kk-suggestions[hidden] { display: none; }
.kk-suggestions:not([hidden]) {
  animation: sugg-reveal .3s ease;
}
@keyframes sugg-reveal {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.kk-suggestions {
  display: flex;
  /* In RTL, default flex direction places items right-to-left naturally — no row-reverse needed */
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 4px 14px;
  /* scroll-snap removed — was causing items to lock in place and feel "stuck" */
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}
.kk-suggestions::-webkit-scrollbar { height: 6px; }
.kk-suggestions::-webkit-scrollbar-track { background: transparent; }
.kk-suggestions::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: 3px;
}
.kk-suggestions::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
.kk-sugg {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 16px 18px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
  position: relative;
  font-family: inherit;
  flex: 0 0 200px;
}
.kk-sugg:hover {
  border-color: var(--green);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px -6px rgba(20,89,60,.15);
}
.kk-sugg-icon {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
}
.kk-sugg-icon.vitamins { background: var(--orange-light); }
.kk-sugg-icon.vitamins svg { color: #D97706; }
.kk-sugg-icon.skincare { background: #fce7f3; }
.kk-sugg-icon.skincare svg { color: #db2777; }
.kk-sugg-icon.thermometer { background: #dbeafe; }
.kk-sugg-icon.thermometer svg { color: #2563eb; }
.kk-sugg-icon svg { width: 30px; height: 30px; }
.kk-sugg-name {
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 4px;
}
.kk-sugg-price {
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--green);
}
.kk-sugg-price .old {
  font-weight: 500;
  font-size: 12px;
  color: var(--text-mute);
  text-decoration: line-through;
  margin-left: 6px;
}
.kk-sugg-add {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--border-2);
  background: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
  transition: all .2s ease;
  z-index: 2;
}
.kk-sugg-add:hover {
  border-color: var(--green);
  background: var(--green-light);
  transform: scale(1.1);
}
.kk-sugg-add:active { transform: scale(.95); }
.kk-sugg-add svg {
  width: 14px;
  height: 14px;
  color: var(--text-mute);
  transition: color .2s ease;
}
.kk-sugg-add .ic-check { display: none; }

/* Added state — green filled */
.kk-sugg-add.added {
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 2px 8px -2px rgba(20,89,60,.3);
}
.kk-sugg-add.added .ic-plus { display: none; }
.kk-sugg-add.added .ic-check { display: block; }
.kk-sugg-add.added svg { color: #fff; }

/* When added, highlight the whole card */
.kk-sugg:has(.kk-sugg-add.added) {
  border-color: var(--green);
  box-shadow: 0 6px 16px -6px rgba(20,89,60,.18);
}

/* ============================================================
   MODALS — shared design system with hospital kiosk
   ============================================================ */
.kk-modal-back {
  position: fixed;
  inset: 0;
  background: rgba(26,39,48,.55);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
  overflow-y: auto;
}
.kk-modal-back.show {
  display: flex;
  animation: fade-in .25s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.kk-modal {
  background: #fff;
  border-radius: 22px;
  padding: 32px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.25);
  animation: slide-up .3s ease;
}
@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.kk-modal-icon {
  width: 70px;
  height: 70px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
}
.kk-modal-icon.danger { background: var(--red-light); }
.kk-modal-icon.danger svg { color: #DC2626; width: 36px; height: 36px; }
.kk-modal-icon.success { background: var(--green-light); }
.kk-modal-icon.success svg { color: var(--green); width: 36px; height: 36px; }
.kk-modal-icon.warning { background: var(--orange-light); }
.kk-modal-icon.warning svg { color: var(--orange); width: 36px; height: 36px; }

.kk-modal h3 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 24px;
  color: var(--text);
  margin-bottom: 8px;
}
.kk-modal p {
  font-size: 15px;
  color: var(--text-mute);
  line-height: 1.6;
  margin-bottom: 22px;
}
.kk-modal p b { color: var(--text); font-weight: 700; }
.kk-modal-actions {
  display: flex;
  gap: 10px;
}
.kk-modal-btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  transition: all .15s;
}
.kk-modal-btn.cancel {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.kk-modal-btn.cancel:hover { background: var(--border); }
.kk-modal-btn.confirm-danger {
  background: #DC2626;
  color: #fff;
}
.kk-modal-btn.confirm-danger:hover { background: #B91C1C; }
.kk-modal-btn.confirm-success {
  background: var(--green);
  color: #fff;
}
.kk-modal-btn.confirm-success:hover { background: var(--green-dark); }
.kk-modal-btn.full { flex: 1; }

/* ===== PHARMACY TICKET MODAL ===== */
.kk-ticket {
  background: #fff;
  border-radius: 16px;
  padding: 0;
  max-width: 400px;
  width: 100%;
  max-height: 90vh;
  box-shadow: 0 30px 80px rgba(0,0,0,.25);
  animation: slide-up .3s ease;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.kk-ticket-head {
  background: var(--green);
  color: #fff;
  padding: 32px 24px 28px;
  text-align: center;
  position: relative;
}
.kk-ticket-head .check {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  animation: success-pop .5s cubic-bezier(.2,.9,.3,1.4) .1s both;
}
@keyframes success-pop {
  0% { transform: scale(0); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.kk-ticket-head .check svg {
  width: 30px;
  height: 30px;
  color: #fff;
}
.kk-ticket-head h3 {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 22px;
  margin-bottom: 4px;
}
.kk-ticket-head small {
  font-size: 13px;
  opacity: .9;
}
.kk-ticket-head::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 0;
  right: 0;
  height: 20px;
  background-image: radial-gradient(circle at 10px 10px, transparent 10px, var(--green) 10px);
  background-size: 20px 20px;
  background-position: 0 -10px;
}
.kk-ticket-body {
  padding: 28px 24px 16px;
  flex: 1;
  overflow-y: auto;
}
.kk-ticket-num {
  text-align: center;
  margin-bottom: 22px;
  padding: 18px;
  background: var(--green-light);
  border-radius: 14px;
  border: 1px dashed var(--green);
}
.kk-ticket-num-label {
  font-family: 'Tajawal', sans-serif;
  font-size: 12px;
  color: var(--text-mute);
  font-weight: 600;
  margin-bottom: 6px;
}
.kk-ticket-num-value {
  font-family: 'Tajawal', sans-serif;
  font-weight: 900;
  font-size: 44px;
